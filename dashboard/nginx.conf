server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any unmatched path falls back to index.html so React
    # Router handles it client-side, instead of nginx 404ing on /alerts.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxies /api/* straight to the backend container on the Docker
    # network - the dashboard never needs to know the backend's real host.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
