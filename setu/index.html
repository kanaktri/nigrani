<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DoSJE Setu</title>
<!--
  DoSJE Setu - the institute/beneficiary-facing platform.
  Deliberately built as ONE plain HTML file, no framework, no build step,
  no bundler, system fonts only - because Setu's own spec calls for
  "lightweight, low-bandwidth", and the institutes most likely to need
  this are often in exactly the low-connectivity districts where a heavy
  app bundle or an APK download is the biggest barrier. Opening this file
  (or hitting it on a tiny static server) costs a few KB and works on any
  phone browser instantly - no install, no app store, no build toolchain
  for the person deploying it either.
-->
<style>
  :root {
    --ink: #12222E; --ink-2: #1B3446; --ink-3: #294A61;
    --paper: #F3F0E7; --paper-dim: #E7E2D2;
    --red: #C6432B; --red-dim: #F4E1DC;
    --amber: #C68A2B; --amber-dim: #F5E9D6;
    --green: #3E7A55; --green-dim: #DEEAE2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--paper); color: var(--ink); min-height: 100vh;
  }
  .topbar { background: var(--ink); color: var(--paper); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
  .topbar .brand { font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
  .topbar button { background: none; border: 1px solid rgba(243,240,231,0.3); color: var(--paper); padding: 6px 10px; border-radius: 6px; font-size: 12px; }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }
  .card { background: white; border: 1px solid var(--paper-dim); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: #6b7280; margin-bottom: 4px; margin-top: 10px; }
  input, textarea { width: 100%; padding: 10px; border: 1px solid var(--paper-dim); border-radius: 6px; font-size: 15px; font-family: inherit; }
  button.primary { width: 100%; background: var(--ink); color: var(--paper); border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 500; margin-top: 14px; }
  button.secondary { background: white; color: var(--ink); border: 1px solid var(--ink-3); padding: 8px 12px; border-radius: 6px; font-size: 13px; }
  .score { font-size: 42px; font-weight: 700; font-family: monospace; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; text-transform: uppercase; font-weight: 600; }
  .badge.green { background: var(--green-dim); color: var(--green); }
  .badge.yellow { background: var(--amber-dim); color: var(--amber); }
  .badge.red { background: var(--red-dim); color: var(--red); }
  .finding { border-left: 4px solid var(--red); padding: 10px 12px; background: var(--red-dim); border-radius: 4px; margin-bottom: 10px; }
  .finding.yellow { border-left-color: var(--amber); background: var(--amber-dim); }
  .nav { display: flex; border-top: 1px solid var(--paper-dim); position: fixed; bottom: 0; left: 0; right: 0; background: white; }
  .nav button { flex: 1; background: none; border: none; padding: 12px 0; font-size: 12px; color: #6b7280; }
  .nav button.active { color: var(--ink); font-weight: 600; }
  .error { color: var(--red); font-size: 13px; margin-top: 8px; }
  .muted { color: #6b7280; font-size: 13px; }
  .spacer { height: 70px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---- Config ----------------------------------------------------------
// The API base is stored in localStorage so it can be pointed at any
// backend (local dev, a deployed instance) without editing this file -
// a person deploying Setu just needs to change this once, via the
// settings gear on the login screen.
const DEFAULT_API_BASE = "http://localhost:8000/api/v1";
function getApiBase() { return localStorage.getItem("setu_api_base") || DEFAULT_API_BASE; }
function setApiBase(v) { localStorage.setItem("setu_api_base", v); }

// ---- Minimal i18n ------------------------------------------------------
// Scoped honestly: this covers the key screen labels, not a full
// translation framework. It's a real, working language toggle - not a
// promise of complete localization.
const STRINGS = {
  en: {
    appName: "DoSJE Setu", signIn: "Sign in", email: "Email", password: "Password",
    signInBtn: "Sign in", home: "Home", findings: "Findings", grievances: "Grievances",
    signOut: "Sign out", complianceScore: "Compliance Score", status: "Status",
    yourFindings: "Findings for your institute", noFindings: "No open findings right now.",
    respond: "Respond with a document", uploadDoc: "Upload document", description: "Description (optional)",
    submitDoc: "Submit document", fileGrievance: "File a grievance", subject: "Subject",
    detail: "Description", submitGrievance: "Submit grievance", yourGrievances: "Your grievances",
    noGrievances: "No grievances filed yet.", loginError: "Email and password don't match our records",
    settings: "Settings", apiBase: "Backend API address", save: "Save",
  },
  hi: {
    appName: "डीओएसजेई सेतु", signIn: "साइन इन करें", email: "ईमेल", password: "पासवर्ड",
    signInBtn: "साइन इन करें", home: "होम", findings: "निष्कर्ष", grievances: "शिकायतें",
    signOut: "साइन आउट करें", complianceScore: "अनुपालन स्कोर", status: "स्थिति",
    yourFindings: "आपके संस्थान के लिए निष्कर्ष", noFindings: "अभी कोई खुला निष्कर्ष नहीं है।",
    respond: "दस्तावेज़ के साथ जवाब दें", uploadDoc: "दस्तावेज़ अपलोड करें", description: "विवरण (वैकल्पिक)",
    submitDoc: "दस्तावेज़ जमा करें", fileGrievance: "शिकायत दर्ज करें", subject: "विषय",
    detail: "विवरण", submitGrievance: "शिकायत जमा करें", yourGrievances: "आपकी शिकायतें",
    noGrievances: "अभी तक कोई शिकायत दर्ज नहीं की गई।", loginError: "ईमेल और पासवर्ड हमारे रिकॉर्ड से मेल नहीं खाते",
    settings: "सेटिंग्स", apiBase: "बैकएंड API पता", save: "सहेजें",
  },
};

// ---- State -------------------------------------------------------------
let state = {
  token: localStorage.getItem("setu_token"),
  user: JSON.parse(localStorage.getItem("setu_user") || "null"),
  lang: localStorage.getItem("setu_lang") || "en",
  view: "login",
  institute: null,
  findings: [],
  grievances: [],
  error: "",
  loading: false,
};
function t(key) { return (STRINGS[state.lang] && STRINGS[state.lang][key]) || key; }

// ---- API helper ----------------------------------------------------------
async function api(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  if (opts.body instanceof FormData) delete headers["Content-Type"]; // let the browser set the multipart boundary

  const resp = await fetch(getApiBase() + path, Object.assign({}, opts, { headers }));
  if (resp.status === 401) {
    logout();
    throw new Error("Session expired - please sign in again");
  }
  if (!resp.ok) {
    const body = await resp.json().catch(() => ({}));
    throw new Error(body.detail || `Request failed (${resp.status})`);
  }
  return resp.status === 204 ? null : resp.json();
}

function logout() {
  localStorage.removeItem("setu_token");
  localStorage.removeItem("setu_user");
  state.token = null; state.user = null; state.view = "login";
  render();
}

// ---- Data loading --------------------------------------------------------
async function loadHomeData() {
  if (!state.user.institute_id) return;
  state.loading = true; render();
  try {
    const [score, findings, grievances] = await Promise.all([
      api(`/institutes/${state.user.institute_id}/score`),
      api(`/institutes/${state.user.institute_id}/alerts`),
      api(`/grievances`),
    ]);
    state.institute = score;
    state.findings = findings;
    state.grievances = grievances;
  } catch (e) {
    state.error = e.message;
  } finally {
    state.loading = false; render();
  }
}

// ---- Views -----------------------------------------------------------
function viewLogin() {
  return `
    <div class="topbar">
      <div class="brand">${t("appName")}</div>
      <button onclick="showSettings()">${t("settings")}</button>
    </div>
    <div class="container">
      <div class="card">
        <label>${t("email")}</label>
        <input id="loginEmail" type="email" placeholder="staff@dosje.gov.in" />
        <label>${t("password")}</label>
        <input id="loginPassword" type="password" placeholder="••••••••" />
        ${state.error ? `<p class="error">${state.error}</p>` : ""}
        <button class="primary" onclick="doLogin()">${t("signInBtn")}</button>
      </div>
      <p class="muted">Demo: staff@dosje.gov.in / Password123!</p>
      <div style="text-align:right"><button class="secondary" onclick="toggleLang()">${state.lang === "en" ? "हिंदी" : "English"}</button></div>
    </div>
  `;
}

function viewSettings() {
  return `
    <div class="topbar"><div class="brand">${t("settings")}</div><button onclick="state.view='login'; render()">←</button></div>
    <div class="container">
      <div class="card">
        <label>${t("apiBase")}</label>
        <input id="apiBaseInput" value="${getApiBase()}" />
        <button class="primary" onclick="saveApiBase()">${t("save")}</button>
      </div>
    </div>
  `;
}

function statusBadge(status) {
  return `<span class="badge ${status}">${status}</span>`;
}

function viewHome() {
  if (!state.institute) return `<div class="container"><p class="muted">Loading…</p></div>`;
  return `
    ${topbar()}
    <div class="container">
      <div class="card">
        <label>${t("complianceScore")}</label>
        <div class="score">${state.institute.compliance_score}</div>
        <div style="margin-top:6px">${statusBadge(state.institute.status)}</div>
      </div>
    </div>
    <div class="spacer"></div>
    ${bottomNav("home")}
  `;
}

function viewFindings() {
  const items = state.findings.length
    ? state.findings.map(f => `
        <div class="finding ${f.severity}">
          <strong>${f.type.replace(/_/g, " ")}</strong>
          <p class="muted" style="margin:4px 0">${f.detail || ""}</p>
          <button class="secondary" onclick="showRespond('${f.id}')">${t("respond")}</button>
        </div>
      `).join("")
    : `<p class="muted">${t("noFindings")}</p>`;

  return `
    ${topbar()}
    <div class="container">
      <h3 style="font-size:15px">${t("yourFindings")}</h3>
      ${items}
      <div id="respondForm"></div>
    </div>
    <div class="spacer"></div>
    ${bottomNav("findings")}
  `;
}

function showRespond(alertId) {
  document.getElementById("respondForm").innerHTML = `
    <div class="card">
      <label>${t("uploadDoc")}</label>
      <input type="file" id="docFile" />
      <label>${t("description")}</label>
      <textarea id="docDesc" rows="2"></textarea>
      <button class="primary" onclick="submitDocument('${alertId}')">${t("submitDoc")}</button>
    </div>
  `;
}

async function submitDocument(alertId) {
  const fileInput = document.getElementById("docFile");
  if (!fileInput.files.length) { alert("Choose a file first"); return; }
  const form = new FormData();
  form.append("file", fileInput.files[0]);
  form.append("description", document.getElementById("docDesc").value);
  form.append("alert_id", alertId);
  try {
    await api(`/institutes/${state.user.institute_id}/documents`, { method: "POST", body: form });
    alert("Document submitted");
    loadHomeData();
  } catch (e) {
    alert(e.message);
  }
}

function viewGrievances() {
  const items = state.grievances.length
    ? state.grievances.map(g => `
        <div class="card">
          <strong>${g.subject}</strong> ${statusBadge(g.status === "open" ? "yellow" : "green")}
          <p class="muted" style="margin:4px 0">${g.description}</p>
        </div>
      `).join("")
    : `<p class="muted">${t("noGrievances")}</p>`;

  return `
    ${topbar()}
    <div class="container">
      <div class="card">
        <h3 style="font-size:15px; margin-top:0">${t("fileGrievance")}</h3>
        <label>${t("subject")}</label>
        <input id="grievanceSubject" />
        <label>${t("detail")}</label>
        <textarea id="grievanceDesc" rows="3"></textarea>
        <button class="primary" onclick="submitGrievance()">${t("submitGrievance")}</button>
      </div>
      <h3 style="font-size:15px">${t("yourGrievances")}</h3>
      ${items}
    </div>
    <div class="spacer"></div>
    ${bottomNav("grievances")}
  `;
}

async function submitGrievance() {
  const subject = document.getElementById("grievanceSubject").value;
  const description = document.getElementById("grievanceDesc").value;
  if (subject.length < 3 || description.length < 5) { alert("Please fill in both fields"); return; }
  try {
    await api("/grievances", {
      method: "POST",
      body: JSON.stringify({ institute_id: state.user.institute_id, subject, description }),
    });
    document.getElementById("grievanceSubject").value = "";
    document.getElementById("grievanceDesc").value = "";
    loadHomeData();
  } catch (e) {
    alert(e.message);
  }
}

function topbar() {
  return `
    <div class="topbar">
      <div class="brand">${t("appName")}</div>
      <button onclick="logout()">${t("signOut")}</button>
    </div>
  `;
}

function bottomNav(active) {
  return `
    <div class="nav">
      <button class="${active === 'home' ? 'active' : ''}" onclick="state.view='home'; render()">${t("home")}</button>
      <button class="${active === 'findings' ? 'active' : ''}" onclick="state.view='findings'; render()">${t("findings")}</button>
      <button class="${active === 'grievances' ? 'active' : ''}" onclick="state.view='grievances'; render()">${t("grievances")}</button>
    </div>
  `;
}

// ---- Actions -------------------------------------------------------------
async function doLogin() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  state.error = "";
  try {
    const resp = await api("/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
    state.token = resp.access_token;
    state.user = { role: resp.role, name: resp.name, user_id: resp.user_id, institute_id: resp.institute_id };
    localStorage.setItem("setu_token", state.token);
    localStorage.setItem("setu_user", JSON.stringify(state.user));
    state.view = "home";
    render();
    loadHomeData();
  } catch (e) {
    state.error = t("loginError");
    render();
  }
}

function showSettings() { state.view = "settings"; render(); }
function saveApiBase() {
  setApiBase(document.getElementById("apiBaseInput").value);
  state.view = "login"; render();
}
function toggleLang() {
  state.lang = state.lang === "en" ? "hi" : "en";
  localStorage.setItem("setu_lang", state.lang);
  render();
}

// ---- Render --------------------------------------------------------------
function render() {
  const app = document.getElementById("app");
  if (!state.token || !state.user) {
    app.innerHTML = state.view === "settings" ? viewSettings() : viewLogin();
    return;
  }
  if (state.view === "findings") app.innerHTML = viewFindings();
  else if (state.view === "grievances") app.innerHTML = viewGrievances();
  else app.innerHTML = viewHome();
}

render();
if (state.token && state.user) loadHomeData();
</script>
</body>
</html>
